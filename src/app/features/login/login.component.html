<div class="page">
  <div class="card">
    <h1>🏃 Training Helper</h1>
    <p class="subtitle">Track your activities and stats in one place.</p>

    <form (ngSubmit)="login()">
      @if (error()) {
        <div class="alert alert-error">{{ error() }}</div>
      }

      <div class="field">
        <label for="username">Username or email</label>
        <input id="username" name="username" type="text" autocomplete="username" required
               [(ngModel)]="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               [(ngModel)]="password" />
      </div>

      <button type="submit" class="primary-btn" [disabled]="submitting() || !username.trim() || !password">
        {{ submitting() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <div class="links">
      <span>No account yet?&nbsp;<a routerLink="/register">Create one</a></span>
    </div>

    <div class="divider">or</div>

    <button class="strava-btn" (click)="auth.loginWithStrava()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/>
      </svg>
      Connect with Strava
    </button>

    <p class="footer">Your data stays private – only you can see your activities.</p>
  </div>
</div>
