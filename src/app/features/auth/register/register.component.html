<div class="page">
  <div class="card">
    <h1>Create an account</h1>
    <p class="subtitle">Register with a username, email and password.</p>

    <form (ngSubmit)="register()">
      @if (error()) {
        <div class="alert alert-error">{{ error() }}</div>
      }

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required
               minlength="3" maxlength="32" [(ngModel)]="username" />
        <span class="hint">3–32 characters: letters, digits, _ . -</span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               [(ngModel)]="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required
               minlength="8" maxlength="128" [(ngModel)]="password" />
        <span class="hint">At least 8 characters, with a letter and a digit.</span>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required
               [(ngModel)]="confirmPassword" />
      </div>

      <button type="submit" class="primary-btn"
              [disabled]="submitting() || !username.trim() || !email.trim() || !password || !confirmPassword">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <div class="links">
      <span>Already have an account?&nbsp;<a routerLink="/login">Log in</a></span>
    </div>
  </div>
</div>
